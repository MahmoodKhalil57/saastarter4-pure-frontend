                - heading "The shoulder" [level=3] [ref=f2e75]
                - paragraph [ref=f2e76]: The reed is opened at a long shallow angle so the ink has somewhere to sit. Cut it short and the pen runs dry mid-letter.
              - listitem [ref=f2e77]:
                - heading "The slit" [level=3] [ref=f2e78]
                - paragraph [ref=f2e79]: One press splits the nib down the centre. It has to stop exactly where the shoulder ends, or the two halves will spread under pressure.
              - listitem [ref=f2e80]:
                - heading "The qatt" [level=3] [ref=f2e81]
                - paragraph [ref=f2e82]: The tip is trimmed against the qat'ah at the angle your script needs — flat for thuluth, oblique for nastaliq. This is the cut you cannot take back.
