# Sveltia CMS configuration
# Docs: https://sveltiacms.app/en/docs
#
# CHANGE THIS FIRST: `repo` must be the GitHub repository this site is
# committed to, in owner/name form. Everything else works as-is.
#
# The split between this CMS and the visual builder (/admin/builder.html):
# the CMS edits DATA — lists and settings that render the same way every
# time (catalog items, steps, questions, links, the announcement). The words
# and layout of the page itself are edited visually in the builder, which
# owns index.html. Headings, the hero, and the page <head> are not here on
# purpose.

backend:
  name: github
  repo: MahmoodKhalil57/saastarter4-pure-frontend
  branch: master
  # Token only: GitHub Pages has no server, so there is nowhere to run an OAuth
  # client. Sign in with a personal access token instead. Add 'oauth' here if you
  # later deploy the sveltia-cms-auth worker.
  auth_methods: [token]
  commit_messages:
    update: 'content: update {{collection}} "{{slug}}"'
    uploadMedia: "media: upload {{path}}"
    deleteMedia: "media: delete {{path}}"

# The site is served from the repository root (GitHub Pages, deploy from
# branch), so repo paths and public URLs are the same thing.
media_folder: media/uploads
public_folder: /media/uploads

site_url: https://mahmoodkhalil57.github.io/saastarter4-pure-frontend/
display_url: https://mahmoodkhalil57.github.io/saastarter4-pure-frontend/

collections:
  - name: content
    label: Content
    icon: description
    files:
      - name: landing
        label: Landing page
        file: content/landing.json
        format: json
        description: The steps, the questions, and how the sign-up form behaves.
        fields:
          - label: Sign-up form
            name: notify
            widget: object
            fields:
              - label: Message after signing up
                name: success_note
                widget: string
              - label: Form endpoint
                name: form_action
                widget: string
                required: false
                hint: >-
                  A POST URL from Formspree, Basin, or similar. Leave empty and
                  the form opens the visitor's mail app instead.
          - label: How it is made
            name: craft
            widget: object
            fields:
              - label: Steps
                name: steps
                widget: list
                label_singular: Step
                summary: "{{fields.title}}"
                hint: Numbered on the page in this order.
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
          - label: Questions
            name: faq
            widget: object
            fields:
              - label: Questions
                name: items
                widget: list
                label_singular: Question
                summary: "{{fields.question}}"
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Answer, name: answer, widget: text }

      - name: catalog
        label: Catalog
        file: content/catalog.json
        format: json
        description: The items shown in the Lot One grid.
        fields:
          - label: Items
            name: items
            widget: list
            label_singular: Item
            summary: "{{fields.lot}} — {{fields.title}}"
            fields:
              - { label: Lot number, name: lot, widget: string, hint: "Shown as “Lot 01”." }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: blurb, widget: text, required: false }
              - label: Price
                name: price
                widget: string
                required: false
                hint: Free text, so you can write “From 34” or “26 for 25 sheets”.
              - label: Status
                name: status
                widget: select
                required: false
                # The explicit empty option is load-bearing, not cosmetic: on an
                # optional select with no empty-value option, Sveltia (<= 0.187)
                # prepends one reactively and enters an infinite loop as soon as
                # the field has a value, hanging the whole entry editor.
                options:
                  - { label: Not set, value: "" }
                  - { label: Opens first, value: Opens first }
                  - { label: Pre-order, value: Pre-order }
                  - { label: 30 made, value: 30 made }
                  - { label: 12 made, value: 12 made }
                  - { label: Sold out, value: Sold out }
              - { label: Photograph, name: image, widget: image, required: false }
              - label: Photograph description
                name: image_alt
                widget: string
                required: false
                hint: Read aloud by screen readers. Describe the object, not the photo.

  # Pages and Symbols are where things are CREATED and BOUND: Sveltia owns
  # what a page or symbol IS (slug, title, backend binding); the visual
  # builder owns what it LOOKS like. Each entry is one file; the builder
  # bakes aggregated manifests (content/pages.json, content/symbols.json)
  # on save for the static runtime to read.
  - name: pages
    label: Pages
    label_singular: Page
    icon: web
    folder: content/pages
    create: true
    format: json
    extension: json
    slug: "{{fields.slug}}"
    identifier_field: slug
    summary: "{{fields.slug}} — {{fields.title}}"
    description: >-
      One entry per page. The builder composes each one visually and exports
      it to <slug>.html on save; it cannot create or delete pages — that
      happens here.
    fields:
      - label: Slug
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, digits and dashes only"]
        hint: The file name — "about" becomes about.html. "index" is the homepage.
      - { label: Title, name: title, widget: string, hint: The browser-tab and search-result title. }
      - label: Description
        name: description
        widget: text
        required: false
        hint: What search engines and link previews show.
      - label: Menu label
        name: nav_label
        widget: string
        required: false
        hint: >-
          Shown in the site menu. Leave empty to keep the page out of the menu
          (while any page has one, the menu renders from the Pages list).
      - label: Menu position
        name: nav_order
        widget: number
        required: false
        value_type: int
        hint: Lower numbers come first in the menu.

  - name: symbols
    label: Symbols
    label_singular: Symbol
    icon: extension
    folder: content/symbols
    create: true
    format: json
    extension: json
    slug: "{{fields.id}}"
    identifier_field: id
    summary: "{{fields.name}} ({{fields.id}})"
    description: >-
      One entry per reusable element — declared and bound here, drawn in the
      builder. A symbol edited in the builder updates everywhere it is placed.
    fields:
      - label: Id
        name: id
        widget: string
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, digits and dashes only"]
        hint: Stable handle the builder uses to match the drawing to this entry.
      - { label: Name, name: name, widget: string }
      - label: Binding
        name: binding
        widget: object
        hint: What backend capability this symbol carries, if any.
        fields:
          # `required: true` with a default dodges the same Sveltia
          # optional-select hang the catalog Status field hit.
          - label: Type
            name: type
            widget: select
            required: true
            default: none
            options:
              - { label: None — purely visual, value: none }
              - { label: Form — submits to the backend, value: form }
          - label: Form
            name: form
            widget: string
            required: false
            hint: >-
              Only used when type is Form: the form's slug in odash.json,
              e.g. opening-notice.

  - name: settings
    label: Settings
    icon: settings
    files:
      - name: site
        label: Site
        file: content/site.json
        format: json
        description: The announcement bar, contact details, and where sign-ups go.
        fields:
          - label: Announcement bar
            name: announcement
            widget: string
            required: false
            hint: Shown across the top of the page. Leave empty to hide the bar.
          - label: Backend
            name: backend
            widget: object
            hint: >-
              The saastarter4-emdash instance that receives sign-ups. Neither
              value is a secret — this repository is public.
            fields:
              - label: Backend URL
                name: url
                widget: string
                required: false
                hint: >-
                  e.g. https://saastarter4-emdash.workers.dev — leave empty and the
                  form falls back to the visitor's mail app.
              - label: Form
                name: form
                widget: string
                required: false
                hint: The form's slug in the backend admin, e.g. opening-notice.
          - label: Contact
            name: contact
            widget: object
            fields:
              - label: Email
                name: email
                widget: string
                hint: Where the sign-up form sends people when no form endpoint is set.
              - label: Footer links
                name: links
                widget: list
                label_singular: Link
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
